services:
  akgate-dashboard:
    build: .
    container_name: akgate-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8082}:8082"
    volumes:
      - ./data:/data
    networks:
      - akvorado

  akgate-collector:
    build: .
    container_name: akgate-collector
    restart: unless-stopped
    command: ["python", "-m", "app.collector"]
    env_file:
      - .env
    networks:
      - akvorado

networks:
  akvorado:
    external: true
    name: ${AKVORADO_NETWORK:-akvorado_default}
